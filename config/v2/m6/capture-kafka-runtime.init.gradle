// Capture the classpaths on the actual Kafka Test task, before it starts its JVM.
import groovy.json.JsonOutput
import java.nio.file.Files
import java.nio.file.Path
import java.nio.file.StandardOpenOption
import java.security.MessageDigest
import org.gradle.api.tasks.SourceSetContainer
import org.gradle.api.tasks.testing.Test

def output = Path.of(System.getProperty('nereus.m6.kafkaRuntimeCapture'))
def objectFixture = Boolean.getBoolean('nereus.m6.kafkaObjectRuntimeCapture')
def walFixture = Boolean.getBoolean('nereus.m6.kafkaObjectWalRuntimeCapture')
def bkRecovery = Boolean.getBoolean('nereus.m6.kafkaBkRecoveryRuntimeCapture')
if ([objectFixture, walFixture, bkRecovery].count { it } > 1) {
    throw new GradleException('M6 Kafka runtime capture requires one exact profile')
}

def identify = { Path path ->
    if (path.toRealPath() != path || !Files.isRegularFile(path)) {
        throw new GradleException("Kafka runtime input is not a regular local file: " + path)
    }
    def digest = MessageDigest.getInstance('SHA-256')
    long size = Files.size(path)
    long count = 0
    Files.newInputStream(path).withCloseable { stream ->
        byte[] block = new byte[65536]
        for (int length; (length = stream.read(block)) >= 0;) {
            digest.update(block, 0, length)
            count += length
        }
    }
    if (count != size || Files.size(path) != size) {
        throw new GradleException("Kafka runtime input changed during capture: " + path)
    }
    [bytes: size, sha256: digest.digest().encodeHex().toString()]
}

gradle.projectsEvaluated {
    if (gradle.rootProject.name != 'kafka') {
        throw new GradleException('M6 Kafka runtime capture requires the Kafka build')
    }
    def core = gradle.rootProject.project(':core')
    def walReadDrain = 'nereusKafkaObjectWalReadDrainRealTest'
    def processTask = bkRecovery ? null : walFixture ? 'nereusKafkaObjectWalProcessRealTest'
        : objectFixture ? 'nereusKafkaAsyncObjectProcessRealTest' : 'nereusBookKeeperOwnerRelocationRealTest'
    def testTasks = bkRecovery ? ['nereusBookKeeperM4AdmissionRealTest']
        : walFixture ? ['nereusObjectWalAdapterRealTest', 'nereusKafkaObjectWalAuthorizationRealTest', walReadDrain, processTask]
        : objectFixture ? ['nereusBookKeeperObjectMaterializationRealTest', 'nereusObjectProviderAdmissionRealTest', processTask]
        : [processTask]
    testTasks.each { task ->
        core.tasks.named(task, Test).configure { test ->
            def target = objectFixture || walFixture ? output.resolveSibling(task + '-runtime.json') : output
            def launchesProcess = task == processTask || task == walReadDrain
            if (launchesProcess) {
                test.systemProperty('nereus.nsip.processEvidenceDir', output.resolveSibling('kafka-process-logs').toString())
            }
            def main = core.extensions.getByType(SourceSetContainer).main
            def process = launchesProcess ? main.runtimeClasspath + core.configurations.releaseOnly : core.files()
            def log = launchesProcess ? gradle.rootProject.file('config/log4j2.yaml') : null
            def capture = {
                def inputs = new TreeMap()
                def remember = { Path path ->
                    if (!inputs.containsKey(path.toString())) inputs[path.toString()] = identify(path)
                }
                def classpath = { files ->
                    files.files.collect { file ->
                        Path path = file.toPath().toAbsolutePath()
                        if (Files.isSymbolicLink(path)) throw new GradleException("Redirected classpath: " + path)
                        if (!Files.exists(path)) {
                            inputs[path.toString()] = [absent: true]
                        } else if (Files.isDirectory(path)) {
                            if (path.toRealPath() != path) throw new GradleException("Redirected classpath: " + path)
                            Files.walk(path).withCloseable { entries ->
                                entries.sorted().forEach { entry ->
                                    if (!Files.isDirectory(entry) || Files.isSymbolicLink(entry)) {
                                        remember(entry)
                                    }
                                }
                            }
                        } else {
                            remember(path)
                        }
                        path.toString()
                    }
                }
                def java = test.javaLauncher.get().executablePath.asFile.toPath().toAbsolutePath()
                def installation = test.javaLauncher.get().metadata.installationPath.asFile.toPath().toAbsolutePath()
                def javaFiles = [java, installation.resolve('release'), installation.resolve('lib/modules')]
                if (log != null) javaFiles.add(log.toPath())
                javaFiles.each { path -> remember(path) }
                [schema: 'NEREUS_V2_M6_KAFKA_RUNTIME_V1',
                    testClasspath: classpath(test.classpath), processClasspath: classpath(process),
                    java: java.toString(), processLogConfig: log?.absolutePath,
                    files: inputs]
            }
            test.doFirst {
                Files.writeString(target, JsonOutput.toJson(capture()) + '\n', StandardOpenOption.CREATE_NEW)
            }
            test.doLast {
                if ((launchesProcess && (test.systemProperties['nereus.nsip.processClasspath'] != process.asPath
                        || test.systemProperties['nereus.nsip.processLogConfig'] != log.absolutePath))
                        || Files.readString(target) != JsonOutput.toJson(capture()) + '\n') {
                    throw new GradleException('Kafka runtime inputs changed during native execution')
                }
            }
        }
    }
}
