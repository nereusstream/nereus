gradle.projectsEvaluated {
    def root = gradle.rootProject
    def p = root.findProject(":nereus-pulsar-offload")
    if (p == null) return
    def file = System.getProperty("m6.native.qualifiedBrokerClasspath")
    def scope = System.getProperty("m6.native.qualifiedBrokerProviderScope")
    if (file == null || scope == null) throw new GradleException("Exact broker classpath and provider scope are required")
    ["v2M5NativeBkDeleteSdkDrainRealTest", "v2M5S3ProviderDrainRealTest"].each { name ->
        p.tasks.named(name, Test) { task ->
            systemProperty("nereus.m6.brokerDeleteProviderScope", scope)
            systemProperty("nereus.m6.brokerReadTimeoutSeconds", "0")
            def owned = p.files(new File(file).readLines().findAll { !it.isBlank() })
            classpath = owned + classpath
        }
    }
}
