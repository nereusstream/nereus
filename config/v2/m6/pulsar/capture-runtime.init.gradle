gradle.beforeProject { p ->
    if (p.path in [":pulsar-broker", ":nereus-pulsar-broker"]) {
        p.pluginManager.withPlugin("java") {
            p.tasks.register("m6WriteRuntimeClasspath") {
                def cp = p.sourceSets.main.runtimeClasspath
                dependsOn(p.tasks.named("classes"), cp)
                doLast {
                    new File(System.getProperty("m6.runtime.output")).text = cp.files.collect { it.absolutePath }.join("\n") + "\n"
                }
            }
        }
    }
}
