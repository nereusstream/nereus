name: Build
run-name: "Build (${{ github.event_name }})${{ github.event_name == 'push' && format(' - {0}', github.event.head_commit.message) || github.event_name == 'pull_request' && format(' - PR #{0}', github.event.pull_request.number) || '' }}"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '7/15 * * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Verify evidence Python interpreter
        run: python3 -c 'import sys; print(sys.executable); print(sys.version); assert sys.version_info[:3] == (3, 14, 7)'
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: V2 documentation baseline
        run: ./gradlew v2M0Check
      - name: V2 M6 execution input contracts
        run: ./gradlew v2M6ExecutionInputsContractTest v2M6CoverageContractTest
      - name: V2 M6 Final governance contracts
        run: python3 scripts/check-v2-m6-final-tests.py
      - name: V2 M6 committed Final
        if: github.ref_name == 'nereus/v2-m6-native-pulsar-object-wal' || hashFiles('docs/v2/evidence/v2-m6/**/m6-final.json') != ''
        run: |
          for repo in kafka pulsar; do
            commit="$(python3 -c 'import runpy, sys; print(runpy.run_path("scripts/check-v2-m6-final.py")["COMMITS"][sys.argv[1]])' "$repo")"
            git init --bare --quiet --initial-branch=evidence "$RUNNER_TEMP/m6-$repo"
            git -C "$RUNNER_TEMP/m6-$repo" fetch --quiet --depth=1 --no-tags \
              "https://github.com/nereusstream/$repo.git" "$commit:refs/heads/evidence"
          done
          python3 scripts/check-v2-m6-final.py \
            --kafka-root "$RUNNER_TEMP/m6-kafka" --pulsar-root "$RUNNER_TEMP/m6-pulsar"

  m1-fast-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Verify evidence Python interpreter
        run: python3 -c 'import sys; print(sys.executable); print(sys.version); assert sys.version_info[:3] == (3, 14, 7)'
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: V2 M1 fast source gate
        run: ./gradlew v2M1FastSourceCheck

  m4-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Verify evidence Python interpreter
        run: python3 -c 'import sys; print(sys.executable); print(sys.version); assert sys.version_info[:3] == (3, 14, 7)'
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: V2 M4 historical Final at its published source
        run: |
          historical="$RUNNER_TEMP/m4-final-source"
          git worktree add --detach "$historical" 3c01457295258cf586d56630a63067469be34743
          trap 'git worktree remove --force "$historical"' EXIT
          (cd "$historical" && ./gradlew v2M4Check)
      - name: Check out source-locked Pulsar composite for current modules
        run: |
          pulsar_source="$RUNNER_TEMP/nsip-pulsar-source"
          # M5 pins the SDK dependency; the following module checks validate current NSIP source separately.
          pulsar_commit="$(python3 scripts/check-v2-m5-evidence.py historical-pulsar-commit)"
          git init --quiet "$pulsar_source"
          git -C "$pulsar_source" remote add origin https://github.com/nereusstream/pulsar.git
          git -C "$pulsar_source" fetch --quiet --depth=1 --no-tags origin "$pulsar_commit"
          git -C "$pulsar_source" checkout --quiet --detach "$pulsar_commit"
          test "$(git -C "$pulsar_source" rev-parse HEAD)" = "$pulsar_commit"
      - name: Current NSIP read-path modules
        run: |
          ./gradlew -PpulsarCheckout="$RUNNER_TEMP/nsip-pulsar-source" \
            :nereus-storage-object:test :nereus-kafka-bookkeeper:test :nereus-pulsar-offload:test \
            :nereus-storage-object:spotlessCheck :nereus-kafka-bookkeeper:spotlessCheck \
            :nereus-pulsar-offload:spotlessCheck \
            :nereus-storage-object:checkstyleMain :nereus-storage-object:checkstyleTest \
            :nereus-kafka-bookkeeper:checkstyleMain :nereus-kafka-bookkeeper:checkstyleTest \
            :nereus-pulsar-offload:checkstyleMain :nereus-pulsar-offload:checkstyleTest
