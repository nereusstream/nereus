name: Build
run-name: "Build (${{ github.event_name }})${{ github.event_name == 'push' && format(' - {0}', github.event.head_commit.message) || github.event_name == 'pull_request' && format(' - PR #{0}', github.event.pull_request.number) || '' }}"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '7/15 * * * *'
      timezone: 'Asia/Shanghai'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: V2 documentation baseline
        run: ./gradlew v2M0Check
      - name: V2 M1 local graph boundary
        run: ./gradlew v2M1FoundationCheck v2M1Nta1CodecCheck v2M1ReceiptCapsCheck v2M1G1ValidatorCheck
