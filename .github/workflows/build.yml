name: Build
run-name: "Build (${{ github.event_name }})${{ github.event_name == 'push' && format(' - {0}', github.event.head_commit.message) || github.event_name == 'pull_request' && format(' - PR #{0}', github.event.pull_request.number) || '' }}"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '7/15 * * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: V2 documentation baseline
        run: ./gradlew v2M0Check

  m1-fast-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: V2 M1 fast source gate
        run: ./gradlew v2M1FastSourceCheck

  m4-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: V2 M4 final gate
        run: ./gradlew v2M4Check
