name: Build
run-name: "Build (${{ github.event_name }})${{ github.event_name == 'push' && format(' - {0}', github.event.head_commit.message) || github.event_name == 'pull_request' && format(' - PR #{0}', github.event.pull_request.number) || '' }}"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '7/15 * * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: V2 documentation baseline
        run: ./gradlew v2M0Check

  m1-fast-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: V2 M1 fast source gate
        run: ./gradlew v2M1FastSourceCheck

  m4-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: V2 M4 historical Final at its published source
        run: |
          historical="$RUNNER_TEMP/m4-final-source"
          git worktree add --detach "$historical" 3c01457295258cf586d56630a63067469be34743
          trap 'git worktree remove --force "$historical"' EXIT
          (cd "$historical" && ./gradlew v2M4Check)
      - name: Check out source-locked Pulsar composite for current modules
        run: |
          pulsar_source="$RUNNER_TEMP/nsip-pulsar-source"
          pulsar_commit=a14e0e6f4e49be0677318b4ceefc7b85b445823b
          git init --quiet "$pulsar_source"
          git -C "$pulsar_source" remote add origin https://github.com/nereusstream/pulsar.git
          git -C "$pulsar_source" fetch --quiet --depth=1 --no-tags origin \
            +refs/heads/nereus/v2-m2-pulsar-native-offload:refs/remotes/origin/nereus/v2-m2-pulsar-native-offload
          test "$(git -C "$pulsar_source" rev-parse refs/remotes/origin/nereus/v2-m2-pulsar-native-offload)" = "$pulsar_commit"
          git -C "$pulsar_source" checkout --quiet --detach "$pulsar_commit"
      - name: Current NSIP read-path modules
        run: |
          ./gradlew -PpulsarCheckout="$RUNNER_TEMP/nsip-pulsar-source" \
            :nereus-storage-object:test :nereus-kafka-bookkeeper:test :nereus-pulsar-offload:test \
            :nereus-storage-object:spotlessCheck :nereus-kafka-bookkeeper:spotlessCheck \
            :nereus-pulsar-offload:spotlessCheck \
            :nereus-storage-object:checkstyleMain :nereus-storage-object:checkstyleTest \
            :nereus-kafka-bookkeeper:checkstyleMain :nereus-kafka-bookkeeper:checkstyleTest \
            :nereus-pulsar-offload:checkstyleMain :nereus-pulsar-offload:checkstyleTest
