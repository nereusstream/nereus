name: V2 M1 Trusted Promotion

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-m1-trusted-promotion
  cancel-in-progress: false

jobs:
  exact-source-and-final:
    environment: v2-m1-promotion
    runs-on: [self-hosted, nereus-v2-m1]
    timeout-minutes: 180
    steps:
      - name: Check out Nereus candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read immutable source locks
        id: locks
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          locks = json.loads(Path("docs/v2/source-locks.json").read_text())
          values = {
              "kafka_commit": locks["k1KafkaAuthorityBinding"]["finalForkCommit"],
              "kafka_branch": locks["k1KafkaAuthorityBinding"]["branch"],
              "pulsar_commit": locks["p1PulsarAuthorityBinding"]["finalForkCommit"],
              "pulsar_branch": locks["p1PulsarAuthorityBinding"]["branch"],
              "oxia_client_commit": next(row["finalForkCommit"] for row in locks["dependencyForkOutputs"]
                                         if row["id"] == "oxia-client-notification-continuity"),
              "oxia_client_branch": next(row["branch"] for row in locks["dependencyForkOutputs"]
                                         if row["id"] == "oxia-client-notification-continuity"),
              "oxia_server_commit": locks["dependencyEvidenceBindings"]["oxiaServerRuntime"]["sourceCommit"],
              "oxia_server_branch": next(row["branch"] for row in locks["dependencyImplementationBases"]
                                         if row["id"] == "oxia-server-v2-conformance-base"),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, value in values.items():
                  output.write(f"{name}={value}\n")
          PY

      - name: Check out source-locked external repositories outside the Nereus worktree
        shell: bash
        run: |
          trusted_root="$RUNNER_TEMP/nereus-v2-m1-trusted"
          mkdir -p "$trusted_root"
          clone_locked() {
            local repository="$1"
            local branch="$2"
            local commit="$3"
            local destination="$4"
            git init --quiet "$destination"
            git -C "$destination" remote add origin "https://github.com/nereusstream/$repository.git"
            git -C "$destination" fetch --quiet --no-tags origin \
              "+refs/heads/$branch:refs/remotes/origin/$branch"
            git -C "$destination" checkout --quiet --detach "$commit"
          }
          clone_locked kafka "${{ steps.locks.outputs.kafka_branch }}" \
            "${{ steps.locks.outputs.kafka_commit }}" "$trusted_root/kafka"
          clone_locked pulsar "${{ steps.locks.outputs.pulsar_branch }}" \
            "${{ steps.locks.outputs.pulsar_commit }}" "$trusted_root/pulsar"
          clone_locked oxia-client-java "${{ steps.locks.outputs.oxia_client_branch }}" \
            "${{ steps.locks.outputs.oxia_client_commit }}" "$trusted_root/oxia-client-java"
          clone_locked oxia "${{ steps.locks.outputs.oxia_server_branch }}" \
            "${{ steps.locks.outputs.oxia_server_commit }}" "$trusted_root/oxia"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify trusted runner prerequisites
        shell: bash
        run: |
          command -v docker
          command -v python3
          command -v rg
          docker image inspect "$(python3 -c 'import json; print(json.load(open("docs/v2/source-locks.json"))["dependencyEvidenceBindings"]["oxiaServerRuntime"]["imageReference"])')"

      - name: Regenerate source-bound Fast and Exact gate results
        shell: bash
        run: |
          source_tuple_sha="$(python3 -c 'import json; print(json.load(open("docs/v2/evidence/v2-m1/n3/final-index.json"))["sourceTupleSha"])')"
          ./gradlew v2M1FastGateResult v2M1ExactSourceGateResult \
            -Pv2M1SourceTupleSha="$source_tuple_sha" \
            -Pv2M1FastGateResult="$RUNNER_TEMP/fast.json" \
            -Pv2M1ExactGateResult="$RUNNER_TEMP/exact-source.json" \
            -PkafkaForkCheckout="$RUNNER_TEMP/nereus-v2-m1-trusted/kafka" \
            -PpulsarCheckout="$RUNNER_TEMP/nereus-v2-m1-trusted/pulsar" \
            -PoxiaClientCheckout="$RUNNER_TEMP/nereus-v2-m1-trusted/oxia-client-java" \
            -PoxiaServerCheckout="$RUNNER_TEMP/nereus-v2-m1-trusted/oxia" \
            --no-build-cache --rerun-tasks
          cmp "$RUNNER_TEMP/fast.json" docs/v2/evidence/v2-m1/n3/gates/fast.json
          cmp "$RUNNER_TEMP/exact-source.json" docs/v2/evidence/v2-m1/n3/gates/exact-source.json

      - name: Validate fresh committed Final evidence
        shell: bash
        run: >-
          ./gradlew v2M1FinalCheck
          -Pv2M1FinalIndex=docs/v2/evidence/v2-m1/n3/final-index.json
          --no-build-cache --rerun-tasks
